<text x="138" y="275" font-size="29" fill="#203440" font-weight="700">多平台岗位采集</text>
<rect x="892" y="248" width="132" height="33" rx="6" fill="#e4eef4" stroke="none" stroke-width="1.5"/>
<text x="905" y="272" font-size="18" fill="#246b86" font-weight="500">复用现有</text>
<text x="88" y="317" font-size="22" fill="#5b7180" font-weight="400">岗位关键词／城市／平台配置 → 各渠道并行采集</text>
<text x="88" y="346" font-size="22" fill="#5b7180" font-weight="400">HTTP 接口、会话验证、分页限速与断点续采</text>
<text x="88" y="375" font-size="22" fill="#5b7180" font-weight="400">保留平台岗位ID、来源任务与采集过程记录</text>
