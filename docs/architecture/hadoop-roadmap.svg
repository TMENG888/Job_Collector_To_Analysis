<text x="62" y="124" font-size="29" fill="#157d70" font-weight="700">版本 B｜Hadoop＋Spark 数仓方案（规划，待实现与验证）</text>
<text x="62" y="166" font-size="23" fill="#5b7180" font-weight="400">同一业务目标：多平台岗位采集、数据质量治理、岗位洞察、简历匹配与证据咨询</text>
<text x="62" y="207" font-size="25" fill="#246b86" font-weight="700">业务数据主链路</text>
<text x="1090" y="207" font-size="25" fill="#246b86" font-weight="700">支撑技术与约束</text>
