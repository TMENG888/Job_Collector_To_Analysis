<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本机岗位助手</title><link rel="stylesheet" href="popup.css"><body><h1>本机岗位助手</h1><p>在工作台点击“连接扩展”，复制一次性连接码。</p><form id="pair"><label>连接码<input id="code" autocomplete="off" maxlength="64" required></label><button>连接本机工作台</button></form><p id="status" role="status">未连接</p><button id="authorize" type="button">授权当前招聘页镜像与交互</button><button id="revoke" type="button">停止网页镜像授权</button><button id="disconnect" type="button">断开连接</button><p>只连接 127.0.0.1:8788。截图仅在工作台内存显示；不读取 Cookie、密码或调用调试器。跨站、断开或关闭标签后授权失效。</p><script type="module" src="popup.mjs"></script></body></html>
